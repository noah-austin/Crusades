<meta charset="utf-8">
<title>The Crusades</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: a film. The portolan globe fills the screen; title cards, subtitles and quotes appear over it. */
:root {
  --vellum: #efe5cf;
  --leaf: #f7f0df;
  --ink: #2b2219;
  --ink-soft: #6b5b46;
  --rule: #d8c8a5;
  --vermilion: #a8301d;
  --gold: #94701f;
  --scrim: rgba(239, 229, 207, .82);

  --sea: #cfd4c2;
  --sea-deep: #b4bda8;
  --land: #f4ebd6;
  --coast: #4a3a28;
  --rhumb: rgba(120, 90, 40, .22);

  --r-main: #a8301d;
  --r-godfrey: #7d2a52;
  --r-raymond: #2e6a4f;
  --r-bohemond: #5b3e8c;
  --r-peter: #a5650f;
  --r-baldwin: #2a5e88;
  --foe: #3f6b6b;
  --river: #5f8fa0;
  --mount: #7a6346;

  --f-display: "IM Fell English SC", "Iowan Old Style", Palatino, Georgia, serif;
  --f-body: "Alegreya", "Iowan Old Style", Palatino, Georgia, serif;
  --f-label: "Alegreya Sans SC", "Gill Sans", "Trebuchet MS", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --vellum: #11151d; --leaf: #171c26; --ink: #ece2cb; --ink-soft: #ab9f88; --rule: #2d3441;
    --vermilion: #e2644c; --gold: #d3ad5c; --scrim: rgba(17, 21, 29, .8);
    --sea: #1b2739; --sea-deep: #121b29; --land: #3a3225; --coast: #cfb37a; --rhumb: rgba(211, 173, 92, .16);
    --r-main: #ec6a50; --r-godfrey: #d9789f; --r-raymond: #6cc39a; --r-bohemond: #a990e0; --r-peter: #e3a447; --r-baldwin: #6fb0e6; --foe: #78b0ae; --river: #6fa6bb; --mount: #c2a679;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --vellum: #11151d; --leaf: #171c26; --ink: #ece2cb; --ink-soft: #ab9f88; --rule: #2d3441;
  --vermilion: #e2644c; --gold: #d3ad5c; --scrim: rgba(17, 21, 29, .8);
  --sea: #1b2739; --sea-deep: #121b29; --land: #3a3225; --coast: #cfb37a; --rhumb: rgba(211, 173, 92, .16);
  --r-main: #ec6a50; --r-godfrey: #d9789f; --r-raymond: #6cc39a; --r-bohemond: #a990e0; --r-peter: #e3a447; --r-baldwin: #6fb0e6; --foe: #78b0ae; --river: #6fa6bb; --mount: #c2a679;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--vellum); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  overflow: hidden; -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--vermilion); outline-offset: 2px; }

/* ---------- the screen ---------- */
.stage { position: fixed; inset: 0; overflow: hidden; }
#base, #globe { position: absolute; inset: 0; width: 100%; height: 100%; }
.vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, transparent 55%, var(--vellum) 100%);
  opacity: .85;
}
.pulse {
  position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none;
  border-radius: 50%; border: 2px solid var(--vermilion);
  animation: pulse 2.2s ease-out infinite;
}
@keyframes pulse { from { transform: scale(.7); opacity: 1; } to { transform: scale(3.4); opacity: 0; } }
.days {
  position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  font-family: var(--f-label); font-size: 15px; letter-spacing: .06em; color: var(--ink-soft);
  font-variant-numeric: tabular-nums; pointer-events: none; text-align: right;
  transition: opacity .6s;
}
.days b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; color: var(--vermilion); letter-spacing: 0; }

/* ---------- overlays that fade ---------- */
.fade { opacity: 0; transition: opacity .9s ease; pointer-events: none; }
.fade.show { opacity: 1; }

/* chapter title card */
.titlecard {
  position: absolute; left: 0; right: 0; top: calc(9vh + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
}
.titlecard .date { font-family: var(--f-label); font-size: 16px; letter-spacing: .16em; color: var(--vermilion); text-transform: uppercase; }
.titlecard h2 {
  margin: 6px auto 0; max-width: 18ch; font-family: var(--f-display); font-weight: 400;
  font-size: clamp(38px, 7vw, 76px); line-height: 1.02; text-wrap: balance;
  text-shadow: 0 0 18px var(--vellum), 0 0 4px var(--vellum);
}
.titlecard .rule { display: block; width: 64px; height: 1px; margin: 14px auto 0; background: var(--vermilion); }

/* part card and the opening */
.partcard {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px;
  background: var(--scrim);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.partcard .eyebrow { font-family: var(--f-label); font-size: 17px; letter-spacing: .22em; color: var(--vermilion); text-transform: uppercase; }
.partcard h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(44px, 8vw, 92px); line-height: 1; text-wrap: balance; }
.partcard .years { font-family: var(--f-label); font-size: 20px; letter-spacing: .12em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* subtitles */
.subs {
  position: absolute; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center; pointer-events: none;
}
.subs p {
  margin: 0; max-width: 46ch; text-align: center; font-size: clamp(18px, 2.1vw, 24px); line-height: 1.42;
  padding: 10px 18px; border-radius: 10px; background: var(--scrim);
  transition: opacity .35s;
}
.subs p:empty { opacity: 0; }
body.nosubs .subs { display: none; }

/* quote card */
.quote {
  position: absolute; inset: 0; display: grid; place-content: center; background: var(--scrim);
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.quote blockquote { margin: 0 auto; max-width: 32ch; text-align: center; }
.quote blockquote::before { content: "“"; display: block; font-family: var(--f-display); font-size: 90px; line-height: .6; color: var(--vermilion); }
.quote p { margin: 0; font-style: italic; font-size: clamp(22px, 3vw, 34px); line-height: 1.32; text-wrap: balance; }
.quote cite { display: block; margin-top: 18px; font-style: normal; font-family: var(--f-label); font-size: 16px; letter-spacing: .1em; color: var(--ink-soft); }

/* key figure introduced */
.figure {
  position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(140px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 14px; padding: 10px 18px 10px 10px;
  background: var(--scrim); border-left: 3px solid var(--vermilion); border-radius: 0 12px 12px 0;
  transform: translateX(-12px); transition: opacity .7s, transform .7s;
}
.figure.show { transform: none; }
.figure canvas { width: 64px; height: 64px; flex: none; }
.figure .name { font-family: var(--f-display); font-size: 25px; line-height: 1.1; }
.figure .role { font-size: 15px; color: var(--ink-soft); font-style: italic; }

/* ---------- opening screen ---------- */
.opening {
  position: absolute; inset: 0; z-index: 30; display: grid; place-content: center; text-align: center; gap: 14px;
  background: radial-gradient(ellipse at 50% 50%, var(--scrim) 30%, var(--vellum) 100%);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity 1.2s;
}
.opening.gone { opacity: 0; pointer-events: none; }
.opening .cross { font-size: 40px; color: var(--vermilion); line-height: 1; }
.opening h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(56px, 11vw, 132px); line-height: .95; letter-spacing: .01em; }
.opening .sub { font-family: var(--f-label); font-size: clamp(16px, 2vw, 20px); letter-spacing: .16em; color: var(--ink-soft); text-transform: uppercase; }
.begin {
  justify-self: center; margin-top: 18px; display: inline-flex; align-items: center; gap: 12px;
  padding: 14px 30px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--vermilion); color: var(--leaf);
  font-family: var(--f-label); font-size: 20px; letter-spacing: .12em;
}
.begin svg { width: 18px; height: 18px; fill: currentColor; }
.begin:hover { filter: brightness(1.08); }
.parts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: 16px; color: var(--ink-soft); }
.parts button { background: none; border: 0; padding: 4px 2px; cursor: pointer; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 4px; }
.parts button:hover { color: var(--vermilion); }
.sound-note { font-size: 15px; color: var(--ink-soft); font-style: italic; }

/* ---------- controls: hidden until you touch the screen ---------- */
.progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: transparent; }
.progress i { display: block; height: 100%; width: 0; background: var(--vermilion); transition: width 1s; }
.hud {
  position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  transform: translate(-50%, 8px); display: flex; align-items: center; gap: 6px;
  padding: 6px; border-radius: 999px; background: var(--leaf); border: 1px solid var(--rule);
  box-shadow: 0 6px 24px rgba(0,0,0,.15);
  opacity: 0; pointer-events: none; transition: opacity .35s, transform .35s;
}
body.hud-on .hud { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
body.hud-on .subs { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
.hud button {
  width: 46px; height: 46px; display: grid; place-items: center; border: 0; border-radius: 50%;
  background: none; cursor: pointer;
}
.hud button:hover { background: var(--vellum); }
.hud button.main { background: var(--vermilion); color: var(--leaf); }
.hud svg { width: 20px; height: 20px; fill: currentColor; }
.hud .sep { width: 1px; height: 24px; background: var(--rule); margin: 0 2px; }
.hud .cc { font-family: var(--f-label); font-weight: 700; font-size: 14px; letter-spacing: .04em; }
.hud .off { opacity: .4; }
.where {
  position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 20;
  font-family: var(--f-label); font-size: 14px; letter-spacing: .08em; color: var(--ink-soft);
  opacity: 0; transition: opacity .35s; pointer-events: none;
}
body.hud-on .where { opacity: 1; }

/* chapter list */
dialog {
  width: min(560px, calc(100% - 32px)); max-height: 82vh; padding: 0; overflow: auto;
  border: 1px solid var(--rule); border-radius: 14px; background: var(--leaf); color: var(--ink);
}
dialog::backdrop { background: rgba(20, 14, 6, .5); }
.toc { padding: 22px 24px; display: grid; gap: 18px; }
.toc h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 30px; }
.toc h3 { margin: 0 0 6px; font-family: var(--f-label); font-size: 14px; letter-spacing: .12em; color: var(--vermilion); text-transform: uppercase; }
.toc ol { margin: 0; padding: 0; list-style: none; display: grid; }
.toc li button {
  width: 100%; display: flex; gap: 12px; align-items: baseline; text-align: left; padding: 7px 8px; border: 0; border-radius: 8px;
  background: none; cursor: pointer; font-size: 17px;
}
.toc li button:hover { background: var(--vellum); }
.toc li button.on { background: var(--vellum); box-shadow: inset 3px 0 0 var(--vermilion); }
.toc .d { flex: none; width: 3.4em; font-family: var(--f-label); font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.toc .close { justify-self: end; padding: 8px 18px; border: 1px solid var(--rule); border-radius: 999px; background: none; cursor: pointer; font-family: var(--f-label); font-size: 15px; }

/* ---------- battle and moment scenes (a manuscript plate, same look in both themes) ---------- */
.battle {
  position: fixed; inset: 0; z-index: 10;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  background: #e6d7b5; color: #2a1f16;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: plate-in .9s ease;
}
@keyframes plate-in { from { opacity: 0; } to { opacity: 1; } }
.battle-head {
  display: flex; align-items: center; justify-content: center; text-align: center; gap: 12px;
  padding-block: 14px 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.battle-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.1; }
.battle-meta { font-family: var(--f-label); font-size: 14px; letter-spacing: .12em; color: #a8301d; text-transform: uppercase; }
.battle-head #battle-close, .battle-controls { display: none; }
.battle-field { position: relative; min-height: 0; margin-inline: max(8px, env(safe-area-inset-left, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
.battle-field canvas { position: absolute; inset: 0; }
.battle-foot {
  display: flex; justify-content: center; padding-block: 10px 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.battle-caption { margin: 0; max-width: 46ch; min-height: 3em; text-align: center; font-size: clamp(18px, 2.1vw, 24px); line-height: 1.42; }
body.nosubs .battle-caption { visibility: hidden; }
body.hud-on .battle-foot { padding-bottom: 92px; }

body.hud-on .days { top: calc(48px + env(safe-area-inset-top, 0px)); }
@media (max-width: 640px) {
  .where .wm { display: none; }
  .figure { bottom: auto; top: calc(64px + env(safe-area-inset-top, 0px)); padding: 8px 14px 8px 8px; max-width: calc(100% - 120px); }
  .figure canvas { width: 48px; height: 48px; }
  .figure .name { font-size: 20px; }
  .hud button { width: 42px; height: 42px; }
  .days b { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .pulse { animation: none; }
  .fade, .figure { transition: none; }
}
</style>

<main class="stage" id="stage">
  <canvas id="base" aria-hidden="true"></canvas>
  <canvas id="globe" aria-label="Globe showing the crusades"></canvas>
  <div class="vignette"></div>
  <div class="pulse" id="pulse" hidden></div>
  <div class="days fade" id="days"></div>

  <div class="titlecard fade" id="titlecard"><div class="date" id="tc-date"></div><h2 id="tc-title"></h2><span class="rule"></span></div>
  <div class="figure fade" id="figure"><canvas id="fig-canvas" width="128" height="128" aria-hidden="true"></canvas><div><div class="name" id="fig-name"></div><div class="role" id="fig-role"></div></div></div>
  <div class="quote fade" id="quote"><blockquote><p id="q-text"></p><cite id="q-cite"></cite></blockquote></div>
  <div class="partcard fade" id="partcard"><div class="eyebrow" id="pc-eyebrow"></div><h2 id="pc-title"></h2><div class="years" id="pc-years"></div></div>
  <div class="subs" aria-live="polite"><p id="subs"></p></div>

  <div class="progress"><i id="progress"></i></div>
  <div class="where" id="where"></div>
  <div class="hud" id="hud" role="toolbar" aria-label="Playback">
    <button id="h-prev" aria-label="Previous chapter"><svg viewBox="0 0 16 16"><path d="M3 2.5h2v11H3zM14 2.5v11L6 8z"/></svg></button>
    <button id="h-play" class="main" aria-label="Pause"><svg viewBox="0 0 16 16" id="h-play-icon"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg></button>
    <button id="h-next" aria-label="Next chapter"><svg viewBox="0 0 16 16"><path d="M11 2.5h2v11h-2zM2 2.5v11L10 8z"/></svg></button>
    <span class="sep"></span>
    <button id="h-mute" aria-label="Mute"><svg viewBox="0 0 16 16" id="h-mute-icon"><path d="M2 6h3l4-3.5v11L5 10H2zM11 5.2a4 4 0 0 1 0 5.6l-.9-.9a2.7 2.7 0 0 0 0-3.8zM12.8 3.4a6.5 6.5 0 0 1 0 9.2l-.9-.9a5.2 5.2 0 0 0 0-7.4z"/></svg></button>
    <button id="h-cc" class="cc" aria-label="Subtitles" aria-pressed="true">CC</button>
    <button id="h-toc" aria-label="Chapters"><svg viewBox="0 0 16 16"><path d="M2 3h2v2H2zM6 3h8v2H6zM2 7h2v2H2zM6 7h8v2H6zM2 11h2v2H2zM6 11h8v2H6z"/></svg></button>
  </div>

  <div class="opening" id="opening">
    <div class="cross" aria-hidden="true">✠</div>
    <h1>The Crusades</h1>
    <div class="sub">A chronicle in three parts · 1095–1192</div>
    <button class="begin" id="begin"><svg viewBox="0 0 16 16"><path d="M4 2.5v11L13 8z"/></svg> Begin</button>
    <div class="parts" id="parts"></div>
    <div class="sound-note">Best with sound on. Tap the screen any time for controls.</div>
  </div>
</main>

<dialog id="toc"><div class="toc" id="toc-body"></div></dialog>
