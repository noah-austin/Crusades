<meta charset="utf-8">
<title>Crusades Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: a portolan-chart globe fills the stage; the chronicle reads beside it (desktop) or beneath it (phone). */
:root {
  --vellum: #efe5cf;      /* page ground */
  --leaf: #f7f0df;        /* chronicle panel */
  --ink: #2b2219;
  --ink-soft: #6b5b46;
  --rule: #d8c8a5;
  --vermilion: #a8301d;   /* accent: the cross, the current event */
  --gold: #94701f;

  --sea: #cfd4c2;
  --sea-deep: #b4bda8;
  --land: #f4ebd6;
  --coast: #4a3a28;
  --rhumb: rgba(120, 90, 40, .22);

  --r-main: #a8301d;
  --r-godfrey: #7d2a52;
  --r-raymond: #2e6a4f;
  --r-bohemond: #5b3e8c;
  --r-peter: #a5650f;
  --r-baldwin: #2a5e88;
  --foe: #3f6b6b;
  --river: #5f8fa0;
  --mount: #7a6346;

  --f-display: "IM Fell English SC", "Iowan Old Style", Palatino, Georgia, serif;
  --f-body: "Alegreya", "Iowan Old Style", Palatino, Georgia, serif;
  --f-label: "Alegreya Sans SC", "Gill Sans", "Trebuchet MS", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --vellum: #11151d; --leaf: #171c26; --ink: #ece2cb; --ink-soft: #ab9f88; --rule: #2d3441;
    --vermilion: #e2644c; --gold: #d3ad5c;
    --sea: #1b2739; --sea-deep: #121b29; --land: #3a3225; --coast: #cfb37a; --rhumb: rgba(211, 173, 92, .16);
    --r-main: #ec6a50; --r-godfrey: #d9789f; --r-raymond: #6cc39a; --r-bohemond: #a990e0; --r-peter: #e3a447; --r-baldwin: #6fb0e6; --foe: #78b0ae; --river: #6fa6bb; --mount: #c2a679;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --vellum: #11151d; --leaf: #171c26; --ink: #ece2cb; --ink-soft: #ab9f88; --rule: #2d3441;
  --vermilion: #e2644c; --gold: #d3ad5c;
  --sea: #1b2739; --sea-deep: #121b29; --land: #3a3225; --coast: #cfb37a; --rhumb: rgba(211, 173, 92, .16);
  --r-main: #ec6a50; --r-godfrey: #d9789f; --r-raymond: #6cc39a; --r-bohemond: #a990e0; --r-peter: #e3a447; --r-baldwin: #6fb0e6; --foe: #78b0ae; --river: #6fa6bb; --mount: #c2a679;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--vellum); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.55;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--vermilion); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(340px, 430px);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "head panel" "stage panel";
}

/* ---------- header + timeline ---------- */
.head {
  grid-area: head;
  padding-block: 14px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
  display: grid; gap: 10px;
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 {
  margin: 0; font-family: var(--f-display); font-weight: 400;
  font-size: 26px; line-height: 1; letter-spacing: .01em;
}
.brand h1 .cross { color: var(--vermilion); }
.brand span { font-family: var(--f-label); font-size: 14px; letter-spacing: .06em; color: var(--ink-soft); }

.timeline { position: relative; height: 34px; }
.timeline .track { position: absolute; left: 0; right: 0; top: 9px; height: 2px; background: var(--rule); }
.timeline .fill { position: absolute; left: 0; top: 9px; height: 2px; background: var(--vermilion); transition: width .6s ease; }
.tick {
  position: absolute; top: 0; width: 20px; height: 20px; margin-left: -10px;
  border: 0; padding: 0; background: none; cursor: pointer;
}
.tick::before {
  content: ""; position: absolute; left: 6px; top: 6px; width: 8px; height: 8px;
  border-radius: 50%; background: var(--leaf); box-shadow: inset 0 0 0 2px var(--ink-soft);
  transition: transform .2s;
}
.tick.past::before { background: var(--vermilion); box-shadow: none; }
.tick.on::before { background: var(--vermilion); box-shadow: 0 0 0 3px var(--vellum), 0 0 0 4px var(--vermilion); transform: scale(1.15); }
.tick:hover::before { transform: scale(1.35); }
.year {
  position: absolute; top: 19px; transform: translateX(-50%);
  font-family: var(--f-label); font-size: 12px; letter-spacing: .06em; color: var(--ink-soft);
  font-variant-numeric: tabular-nums; pointer-events: none;
}

/* ---------- globe stage ---------- */
.stage { grid-area: stage; position: relative; min-height: 0; overflow: hidden; }
#base, #globe { position: absolute; inset: 0; width: 100%; height: 100%; }
#globe { touch-action: none; cursor: grab; }
#globe.dragging { cursor: grabbing; }
.pulse {
  position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none;
  border-radius: 50%; border: 2px solid var(--vermilion);
  animation: pulse 2.2s ease-out infinite;
}
@keyframes pulse { from { transform: scale(.7); opacity: 1; } to { transform: scale(3.4); opacity: 0; } }
.recenter {
  position: absolute; right: 12px; bottom: 12px;
  font-family: var(--f-label); font-size: 14px; letter-spacing: .05em;
  background: var(--leaf); border: 1px solid var(--rule); border-radius: 999px;
  padding: 6px 14px; cursor: pointer;
}
.legend {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px;
  display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: calc(100% - 140px);
  font-family: var(--f-label); font-size: 13px; letter-spacing: .04em; color: var(--ink-soft);
}
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

/* ---------- chronicle panel ---------- */
.panel {
  grid-area: panel; min-height: 0; display: flex; flex-direction: column;
  background: var(--leaf); border-left: 1px solid var(--rule);
}
.controls {
  display: flex; align-items: center; gap: 8px;
  padding-block: 12px;
  padding-left: 20px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule);
}
.controls .count { flex: 1; font-family: var(--f-label); font-size: 14px; letter-spacing: .06em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.btn {
  min-width: 44px; height: 40px; padding: 0 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: none; border: 1px solid var(--rule); border-radius: 8px; cursor: pointer;
  font-family: var(--f-label); font-size: 15px; letter-spacing: .04em;
}
.btn:hover:not(:disabled) { border-color: var(--ink-soft); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.primary { background: var(--vermilion); border-color: var(--vermilion); color: var(--leaf); }
.btn svg { width: 16px; height: 16px; fill: currentColor; }

.chapter {
  flex: 1; overflow-y: auto; overscroll-behavior: contain;
  padding-block: 20px 32px;
  padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.eyebrow { font-family: var(--f-label); font-size: 14px; letter-spacing: .08em; color: var(--vermilion); font-variant-numeric: tabular-nums; }
.chapter h2 {
  margin: 4px 0 2px; font-family: var(--f-display); font-weight: 400;
  font-size: 34px; line-height: 1.08; text-wrap: balance;
}
.place { font-style: italic; color: var(--ink-soft); margin-bottom: 14px; }
.chapter p { margin: 0 0 14px; max-width: 62ch; }
.chapter p:first-of-type::first-letter {
  font-family: var(--f-display); color: var(--vermilion);
  float: left; font-size: 3.1em; line-height: .85; padding: 4px 6px 0 0;
}
blockquote {
  margin: 20px 0; padding: 4px 0 4px 16px; border-left: 2px solid var(--gold);
}
blockquote p { font-style: italic; margin: 0 0 6px !important; }
.chapter blockquote p::first-letter, .chapter .myth p::first-letter, .chapter .today::first-letter { all: unset; }
blockquote cite { font-style: normal; font-family: var(--f-label); font-size: 13px; letter-spacing: .05em; color: var(--ink-soft); }
.people { margin-top: 22px; }
.people h3 { margin: 0 0 8px; font-family: var(--f-label); font-weight: 700; font-size: 13px; letter-spacing: .1em; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px 4px 4px;
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 15px;
}
.chip:hover { border-color: var(--ink-soft); }
.seal {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--vermilion); color: var(--leaf); font-family: var(--f-display); font-size: 14px;
}

/* ---------- header controls ---------- */
.crusade-btn {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; margin-left: -8px;
  background: none; border: 1px solid transparent; border-radius: 8px; cursor: pointer;
  font-family: var(--f-label); font-size: 14px; letter-spacing: .06em; color: var(--ink-soft);
}
.crusade-btn:hover { border-color: var(--rule); color: var(--ink); }
.crusade-btn svg, .cinema-btn svg { width: 14px; height: 14px; fill: currentColor; }
.cinema-btn { margin-left: auto; height: 34px; font-size: 14px; }
.cinema-btn[aria-pressed="true"] { background: var(--vermilion); border-color: var(--vermilion); color: var(--leaf); }

/* ---------- day counter ---------- */
.days {
  position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px));
  padding: 6px 12px; border-radius: 8px; background: var(--leaf); border: 1px solid var(--rule);
  font-family: var(--f-label); font-size: 14px; letter-spacing: .05em; color: var(--ink-soft);
  font-variant-numeric: tabular-nums; pointer-events: none;
}
.days b { color: var(--vermilion); font-size: 17px; margin-right: 4px; }

/* ---------- legend ---------- */
.legend { flex-direction: column; flex-wrap: nowrap; gap: 4px; }
.lg-row { display: flex; flex-wrap: wrap; gap: 3px 12px; }
.legend i.sq { width: 11px; height: 11px; border-radius: 2px; border: 1px solid; }

/* ---------- chapter extras ---------- */
.scenes { display: grid; gap: 8px; margin: 6px 0 18px; }
.scenes .watch { margin: 0; }
.watch.moment { background: var(--leaf); color: var(--ink); border: 1px solid var(--vermilion); }
.watch.moment .watch-icon { color: var(--vermilion); }
.watch.moment small { color: var(--ink-soft); opacity: 1; }
.tag {
  display: inline-block; flex: none; padding: 1px 8px; border-radius: 999px;
  font-family: var(--f-label); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  background: var(--ink-soft); color: var(--leaf);
}
.tag.fact { background: var(--vermilion); }
.tag.plain { background: none; color: var(--vermilion); padding: 0; margin-right: 4px; }
.myth { display: grid; gap: 10px; margin: 20px 0; padding: 14px 16px; border: 1px dashed var(--ink-soft); border-radius: 10px; }
.myth-row { display: flex; gap: 10px; align-items: baseline; }
.myth-row p { margin: 0 !important; }
.myth-row p::first-letter, .today::first-letter { all: unset; }
.myth-row:first-child p { text-decoration: line-through; text-decoration-color: var(--vermilion); text-decoration-thickness: 1px; color: var(--ink-soft); }
.today { font-size: 15px; color: var(--ink-soft); }
.sources { margin-top: 22px; }
.sources h3 { margin: 0 0 6px; font-family: var(--f-label); font-weight: 700; font-size: 13px; letter-spacing: .1em; color: var(--ink-soft); }
.sources ul { margin: 0; padding-left: 18px; font-size: 15px; }
.chapter a, blockquote a { color: var(--vermilion); text-underline-offset: 3px; }
canvas.mini { width: 28px; height: 28px; border-radius: 50%; }
canvas.big-portrait { width: 88px; height: 88px; margin-bottom: 8px; }

/* ---------- crusade picker ---------- */
.picker-list { display: grid; gap: 8px; margin-top: 10px; }
.pick {
  display: grid; gap: 2px; text-align: left; padding: 12px 14px; cursor: pointer;
  background: none; border: 1px solid var(--rule); border-radius: 10px;
}
.pick:hover { border-color: var(--ink-soft); }
.pick.on { border-color: var(--vermilion); box-shadow: inset 3px 0 0 var(--vermilion); }
.pick-years { font-family: var(--f-label); font-size: 13px; letter-spacing: .07em; color: var(--vermilion); }
.pick-name { font-family: var(--f-display); font-size: 22px; line-height: 1.15; }
.pick-blurb { font-size: 15px; color: var(--ink-soft); }

/* ---------- cinema ---------- */
.cine { display: none; }
body.cinema .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "stage"; }
body.cinema .head, body.cinema .panel, body.cinema .legend, body.cinema .recenter { display: none; }
body.cinema .cine {
  display: grid; gap: 10px; position: absolute; left: 0; right: 0; bottom: 0;
  padding-block: 40px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, var(--vellum) 55%, transparent);
  pointer-events: none;
}
.cine > * { pointer-events: auto; }
.cine-card { max-width: 64ch; }
.cine-card h2 { margin: 2px 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.08; text-wrap: balance; }
.cine-card p { margin: 0; font-size: 18px; }
.cine-controls { display: flex; flex-wrap: wrap; gap: 8px; }
.cine-controls .btn { background: var(--leaf); }
.brand { flex-wrap: nowrap; align-items: center; min-width: 0; }
.crusade-btn { min-width: 0; }
.crusade-btn #crusade-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cinema-btn { flex: none; }
@media (max-width: 560px) {
  .brand h1 .word { display: none; }
  .crusade-btn { margin-left: 0; font-size: 13px; }
  .cinema-btn .label { display: none; }
}
@media (max-width: 820px) {
  .cinema-btn { height: 32px; padding: 0 10px; }
  .cine-card h2 { font-size: 26px; }
  .cine-card p { font-size: 16px; }
}

/* ---------- watch the battle ---------- */
.watch {
  display: flex; align-items: center; gap: 14px; width: 100%; margin: 6px 0 18px;
  padding: 12px 16px; text-align: left; cursor: pointer;
  background: var(--vermilion); color: var(--leaf); border: 0; border-radius: 10px;
}
.watch:hover { filter: brightness(1.08); }
.watch-icon { font-size: 26px; line-height: 1; }
.watch strong { display: block; font-family: var(--f-label); font-size: 17px; letter-spacing: .05em; }
.watch small { display: block; font-size: 14px; opacity: .85; }

/* ---------- battle scene (a manuscript plate, same look in both themes) ---------- */
.battle {
  position: fixed; inset: 0; z-index: 20;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  background: #e6d7b5; color: #2a1f16;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.battle .btn { border-color: #c9b58c; color: #2a1f16; }
.battle .btn.primary { background: #a8301d; border-color: #a8301d; color: #f7f0df; }
.battle-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.battle-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.1; }
.battle-meta { font-family: var(--f-label); font-size: 14px; letter-spacing: .07em; color: #a8301d; }
.battle-field { position: relative; min-height: 0; margin-inline: max(8px, env(safe-area-inset-left, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
.battle-field canvas { position: absolute; inset: 0; }
.battle-foot {
  display: grid; gap: 10px; padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.battle-caption { margin: 0; max-width: 70ch; min-height: 3.1em; font-size: 17px; line-height: 1.5; }
.battle-controls { display: flex; align-items: center; gap: 8px; }
.battle-dots { flex: 1; display: flex; gap: 6px; }
.battle-dots span { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 2px #6b5b46; }
.battle-dots span.past { background: #a8301d; box-shadow: none; }
.battle-dots span.on { background: #a8301d; box-shadow: 0 0 0 2px #e6d7b5, 0 0 0 3px #a8301d; }
@media (max-width: 820px) {
  .battle-head h2 { font-size: 22px; }
  .battle-caption { font-size: 15px; min-height: 4.5em; }
}

/* ---------- figure dialog ---------- */
dialog {
  width: min(520px, calc(100% - 32px)); max-height: 82vh; padding: 0;
  border: 1px solid var(--rule); border-radius: 12px;
  background: var(--leaf); color: var(--ink);
}
#picker .dlg h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; }
dialog::backdrop { background: rgba(20, 14, 6, .45); }
.dlg { padding: 24px; display: grid; gap: 4px; }
.dlg .seal { width: 52px; height: 52px; font-size: 26px; margin-bottom: 8px; }
.dlg h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1.1; }
.dlg .role { color: var(--ink-soft); font-style: italic; }
.dlg .life { font-family: var(--f-label); font-size: 14px; letter-spacing: .06em; color: var(--vermilion); margin-bottom: 10px; }
.dlg p { margin: 0 0 12px; }
.dlg .appears { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.dlg .appears button { background: none; border: 0; padding: 0; color: var(--vermilion); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 15px; }
.dlg .close { justify-self: end; margin-top: 8px; }

/* ---------- phone ---------- */
@media (max-width: 820px) {
  body { font-size: 16px; }
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(220px, 1fr) minmax(0, 48%);
    grid-template-areas: "head" "stage" "panel";
  }
  .head { padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 6px; }
  .brand h1 { font-size: 22px; }
  .panel { border-left: 0; border-top: 1px solid var(--rule); }
  .controls { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-block: 8px; }
  .chapter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 24px; }
  .chapter h2 { font-size: 28px; }
  .legend { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .pulse { animation: none; }
  .timeline .fill { transition: none; }
}
</style>

<div class="app">
  <header class="head">
    <div class="brand">
      <h1><span class="cross">✠</span><span class="word"> Crusades Atlas</span></h1>
      <button class="crusade-btn" id="crusade-btn" aria-haspopup="dialog"><span id="crusade-name">The First Crusade · 1095–1099</span> <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6l-1.2-1.2L8 8.1 4.7 4.8z"/></svg></button>
      <button class="btn cinema-btn" id="cinema-btn" aria-pressed="false" aria-label="Cinema mode"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3h13v10h-13zM3 4.5v7h10v-7zM6.5 6v4l3.5-2z"/></svg><span class="label"> Cinema</span></button>
    </div>
    <div class="timeline" id="timeline" aria-label="Chapters">
      <div class="track"></div>
      <div class="fill" id="fill"></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="base" aria-hidden="true"></canvas>
    <canvas id="globe" aria-label="Globe showing the route of the First Crusade"></canvas>
    <div class="pulse" id="pulse" hidden></div>
    <div class="days" id="days" hidden></div>
    <div class="cine" id="cine">
      <div class="cine-card">
        <div class="eyebrow" id="cine-date"></div>
        <h2 id="cine-title"></h2>
        <p id="cine-text"></p>
      </div>
      <div class="cine-controls">
        <button class="btn" id="cine-prev" aria-label="Previous chapter"><svg viewBox="0 0 16 16"><path d="M10.5 2 4.5 8l6 6 1.2-1.2L6.9 8l4.8-4.8z"/></svg></button>
        <button class="btn" id="cine-play" aria-label="Play"></button>
        <button class="btn" id="cine-next" aria-label="Next chapter"><svg viewBox="0 0 16 16"><path d="M5.5 2 4.3 3.2 9.1 8l-4.8 4.8L5.5 14l6-6z"/></svg></button>
        <button class="btn" id="cine-exit">Exit cinema</button>
      </div>
